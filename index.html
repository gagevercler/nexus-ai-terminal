. We are in that last step. The argument has moved from 'can it plan' to 'where does it live, and who may it act as'.", "forYou": "This is why scheduled Claude plus connectors felt like the same thing and then suddenly was not. A schedule is still you being the computer. A bot with a machine can hold the job overnight and only interrupt you at the approval. That is the product difference for Datum-style ops and for Vercler workflow offers."}, "next": {"name": "Computer use, but only where a connector cannot go", "confidence": "Medium-high", "horizon": "Into 2027", "summary": "The next wave is the agent driving screens, portals, and old software the way a person does. It will not replace APIs. It fills the gaps APIs never got.", "why": "Computer use is already generally available in more than one stack, and two of the first dedicated computer-use models were already shut down by July 2026. That is what a capability looks like when it stops being a demo and becomes a feature inside the product. The remaining argument is where it is worth the screenshot, the latency, and the messier audit trail.", "notYet": "Unsupervised agents with admin rights. People are already floating automatic patching and root access. That is a risk conversation, not the wave to build on. The buyers who will pay you are the ones who want the artifact reviewed before anything moves.", "watch": ["Does computer use stay a fallback for systems with no API, or do vendors push it as the default even when a connector exists?", "Do approval gates land on the finished artifact, or do they nag on every click? Artifact-level approval is the one operators will tolerate.", "Cost routing: frontier model for the plan, cheaper model for the screen work. Service margins die if every click is a frontier call.", "Identity: whose login is the agent using, and what is the blast radius if that session is hijacked?"]}, "fading": "Calling a scheduled prompt an agent. If the work dies when you close the tab, and you are still the one who remembers to start it, you are still the runtime."}, "timeline": [{"date": "2023–2024", "era": "Chat", "title": "The session is the product", "what": "You open a window, ask, get an answer, close it. State lives in the transcript you remember to paste back.", "why": "This is the baseline every later product is still compared against. If a new tool cannot beat 'I will just ask again', it is not a wave."}, {"date": "2025", "era": "Connectors", "title": "The model can touch your tools, if you start it", "what": "Projects, connectors, and MCP-style tool access let one chat read mail, docs, and tickets. You still open the session and you still decide to run it.", "why": "This is the workstation you already had with Claude. It is powerful and it is not an employee. Nothing happens while you are away unless you armed a schedule."}, {"date": "2025–early 2026", "era": "Schedules", "title": "You design the cadence", "what": "Scheduled tasks and automations run a prompt on a clock and can use the same connectors. The model does the step. You still own the job description, the clock, and the memory between runs.", "why": "This is the thing that made commercial agents feel fake at first. A schedule plus connectors already covers a lot of 'check this every morning'. The gap is continuity, initiative, and a place to keep files."}, {"date": "May 2026", "era": "Computer use", "title": "Screen work enters enterprise tooling", "what": "Microsoft's Copilot Studio computer use reaches general availability. The agent can drive sites and desktop apps, not only APIs.", "why": "Computer use stops being a research demo. It becomes something a company can buy, with all the audit problems that implies."}, {"date": "23–28 Jul 2026", "era": "Computer use", "title": "The first dedicated computer-use models are retired", "what": "OpenAI's computer-use-preview model and Google's Gemini 2.5 Computer Use model are shut down. The capability moves inside newer general models and products.", "why": "A wave is real when the special preview dies and the feature remains. Do not build a plan on a model name that was only a preview."}, {"date": "11 Aug 2026", "era": "Own computer", "title": "Grok Bot beta", "what": "Always-on agents. Each one gets a persistent cloud computer, can sign into existing tools as you, and runs multi-step work until a human needs to approve something.", "why": "This is the cleanest statement of the architectural change: the agent has a machine, not just a prompt."}, {"date": "19 Aug 2026", "era": "Computer use", "title": "Claude computer use leaves beta on the API", "what": "Anthropic takes computer use out of beta on the Claude API and Google Cloud. It stays in beta on some other clouds.", "why": "Availability is uneven on purpose. 'GA' on one cloud is not 'GA' everywhere. Check the surface you would actually ship on."}, {"date": "8 Sep 2026", "era": "Own computer", "title": "Meta Muse launches", "what": "A personal agent on iOS, Android, web, and WhatsApp. Distribution, not a new reasoning trick, is the story.", "why": "Waves that only exist for developers stay small. Muse is the proof that the same pattern is being sold to everyone."}, {"date": "18 Sep 2026", "era": "Judgment", "title": "The year-of-the-agent claim, and the 2027 claim", "what": "A widely circulated operator essay: 2026 was the year companies deployed agents. The predicted next year is computer use, an agent with a screen, a mouse, and a keyboard.", "why": "Useful as a frame, not as a law. It matches what shipped. It will be wrong if computer use stays clumsy and connectors keep winning."}, {"date": "29 Sep 2026", "era": "Own computer", "title": "OpenAI dots", "what": "Always-on agents with their own cloud computer, aimed at ChatGPT paid plans.", "why": "When OpenAI ships the same shape as Grok Bot, the pattern is no longer a single lab's bet."}, {"date": "21 Oct 2026", "era": "Own computer", "title": "Claude Duet, and Muse's scale", "what": "Anthropic o already arguing about, not the thing to sell.", "why": "This entry is the judgment. If a later week contradicts it, add a new dated entry that says what changed. Do not silently rewrite this one."}], "concepts": [{"id": "schedule-vs-agent", "title": "A schedule is not an agent", "stall": "This is the stall. Dots, Grok Bot, Duet, and Muse looked like Claude with a calendar and your connectors. They are not.", "plain": "A scheduled task is a prompt you armed. It runs when the clock says so, inside a session that starts and ends. An always-on agent is a worker with a computer that stays on. It can notice, continue, and come back to you with something to approve.", "difference": ["Who remembers the job. In a schedule, you do. In a bot, the job and its files persist on its machine after you leave.", "Who starts the next step. A schedule waits for its clock. A proactive agent can start because something changed, not because you set 9:00.", "Where the work lives. A chat transcript is not a desk. A persistent computer has files, logins, and half-finished work.", "How you supervise. A schedule shows you the run log. A serious agent is supposed to hand you an artifact and wait, instead of clicking around unseen."], "whenItMatters": "Use a schedule when the task is 'every morning, do this exact thing'. Use an agent when the task is 'own this outcome, and interrupt me when a decision is actually needed'. Most of what feels like hype is a schedule wearing an agent costume. The tell is whether the work survives you closing the window.", "forYou": "RamClean ops and Vercler offers already look like: intake, a reviewable artifact, your approval, then the action. A schedule can generate the artifact on a clock. A bot can watch the inbox or the ticket queue and only produce the artifact when the world changed. That is the part worth selling. Do not sell 'we set a cron'.", "watch": "If a new product cannot name its computer, its memory, and the moment it is allowed to act without you, ned. Computer use is the agent sitting at the screen the way a temp would, because that door was never built.", "difference": ["Connectors are cheaper, more reliable, and easier to audit. Prefer them.", "Computer use reaches carrier portals, old internal apps, and benefit sites nobody will ever integrate.", "A screenshot trail is a worse audit than a tool call. Use it where you have no choice, not as a default."], "whenItMatters": "When the bottleneck is a website a person currently copy-pastes out of. Not when you already have an API.", "forYou": "Vercler workflows that die in a client portal are computer-use candidates. Workflows that already have a connector should stay on the connector. Selling computer use everywhere will be slower and more expensive than the client expects.", "watch": "Vendors retiring the special model and folding the skill into the normal one. That already happened in July 2026. Follow the product status, not the old model card.", "sources": [{"title": "2026 was the agent year, 2027 the computer-use year (Section, 18 Sep 2026)", "url": "https://www.sectionai.com/blog/2026-was-the-year-of-the-agent-2027-is-the-year-of-computer-use"}, {"title": "Computer-use product status as of early Nov 2026", "url": "https://www.querynow.com/ai-agents/what-is-an-ai-agent/computer-use-agents"}]}, {"id": "approval", "title": "Approve the artifact, not the keystrokes", "stall": "Teams hear 'human in the loop' and imagine approving every click. That design gets turned off in a week.", "plain": "The loop that survives is: the agent does the messy work, you review a thing you can read (a draft, a margin sheet, a ticket update), you approve once, then it acts.", "difference": ["Click-level approval: safe, and nobody will use it.", "Artifact approval: you stay accountable for the decision that matters.", "No approval, admin rights: this is what security people are warning about this week. A hijacked agent with root is not a productivity story."], "whenItMatters": " ", "source": "Synthesis · primary write-ups", "title": "The desk moved out of the chat window", "body": "Today's clearest non-launch signal: writers are describing agents as workers with machines, and naming the same products. That is how you know a launch cluster has become the default architecture.", "why": "It changes the book. Previous NEXUS notes said always-on agents were proliferating. This says what they have in common.", "accounts": "Frederick AI, plus the product record for Grok Bot, dots, Duet, Muse, Manus", "origin": "Primary product history plus one same-day analysis. Not a viral thread.", "sources": [{"title": "Frederick AI, 11 Nov 2026", "url": "https://www.frederick.ai/blog/agents-with-their-own-computers"}]}, {"date": "2026-11-11", "source": "Risk signal · not a product wave", "title": "People are already arguing about agents with admin rights", "body": "At a cyber-policy event this week, the warning was specific: automating patches and then letting an agent roll them out with privileges creates a new way to lose the system. Separately, researchers are pointing at realistic video companions as the next social-risk wave, which is not your market but shows where 'always on' goes when it is aimed at attention instead of work.", "why": "Kept so the book does not only track capability. The commercial opening next to this risk is the approval gate.", "accounts": "Adam Gleave; Arvind Narayanan on a different always-on risk", "origin": "Individual expert posts, 11 Nov 2026. Treat as argument, not as a measured incident count.", "sources": []}, {"date": "2026-10-30", "source": "Product record", "title": "Computer use is a feature now, and the old model names are dead", "body": "By early November, Copilot Studio computer use is GA, Claude computer use is out of beta on some clouds, and Gemini computer use is GA with a sandbox. The dedicated preview models from OpenAI and Google were shut down in July.", "why": "Stops you from planning around a model card that no longer exists.", "accounts": "Vendor docs as summarized by QueryNow's 2 Nov status table", "origin": "Secondary compilation of vendor pages. Re-check the vendor page before you build on a specific cloud.", "sources": [{"title": "Computer-use status table", "url": "https://www.querynow.com/ai-agents/what-is-an-ai-agent/computer-use-agents"}]}, {"date": "2026-10-21", "source": "Scale, reported from calls", "title": "Muse and Grok Bot are past the demo", "body": "Coverage of the late-October calls: Meta said more than 10 million Muse setups in the US and Canada, about a quarter active on a given day. SpaceX's call described Grok Bot at 800,000 paid weekly users earlier in the month, more than doubling over the prior month. 'Paid weekly users' was not defined on the call.", "why": "Distribution tells you the wave is not only builders. The undefined metric is why this stays a ledger note and not a precise chart.", "accounts": "Reported remarks from Mark Zuckerberg and Gwynne Shotwell, via UC Today", "origin": "Earnings-call coverage, not the transcript itself.", "sources": [{"title": "UC Today, 30 Oct 2026", "url": "https://uctoday.com/hyper-productivity-is-here-personal-ai"}]}, {"date": "2026-11-04", "source": "NEXUS kept scan", "title": "Permission is the bottleneck, not the demo", "body": "The first book entries already said this and it has not been retired: capability is shipping faster than a buyer's willingness to let an agent act. Open-weight models matter as the cheap workhorse. Identity and least privilege are the part clients will ask you about.", "why": "Retained on purpose. Later hype does not delete it.", "accounts": "NEXUS scans of 4–5 Nov 2026", "origin": "Internal synthesis from those pulls. Primary links were checked at the time; re-verify before you quote a model name to a client.", "sources": []}], "accounts": [{"handle": "@levie", "name": "Aaron Levie", "why": "Says the practical version out loud: multi-model agents, enterprise constraints, what actually ships.", "url": "https://x.com/levie"}, {"handle": "@OpenAI", "name": "OpenAI", "why": "Primary source for dots and whatever replaces a model preview.", "url": "https://x.com/OpenAI"}, {"handle": "@AnthropicAI", "name": "Anthropic", "why": "Primary source for computer use status and Duet.", "url": "https://x.com/AnthropicAI"}, {"handle": "@karpathy", "name": "Andrej Karpathy", "why": "Useful when a launch is being overread. He talks about what the systems actually do.", "url": "https://x.com/karpathy"}, {"handle": "@random_walker", "name": "Arvind Narayanan", "why": "The skeptic worth reading before you call something a wave.", "url": "https://x.com/random_walker"}, {"handle": "@swyx", "name": "swyx", "why": "Operator-level notes on agent tooling, less launch theater.", "url": "https://x.com/swyx"}]}</script>
<script>
const KB = JSON.parse(document.getElementById('kb-data').textContent);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&','<':'<','>':'>','"':'"',"'":'&#39;'}[c]));
}
function links(arr) {
  if (!arr || !arr.length) return '';
  return '<ul>' + arr.map(s => '<li><a href="' + esc(s.url) + '" target="_blank" rel="noopener">' + esc(s.title) + '</a></li>').join('') + '</ul>';
}
function tags(list) {
  return (list || []).map(t => '<span class="tag">' + esc(t) + '</span>').join('');
}

document.getElementById('asof').textContent = 'AS OF ' + KB.meta.asOf + '  ·  ' + KB.timeline.length + ' TIMELINE  ·  ' + KB.concepts.length + ' CONCEPTS';
document.getElementById('pulse-line').textContent = 'PULSE  ' + KB.pulse;
document.getElementById('book-note').textContent = KB.meta.note;
document.getElementById('ed').textContent = KB.meta.edition;
document.getElementById('stats').innerHTML = [
  [KB.judgment.current.confidence, 'Current-wave confidence'],
  [KB.judgment.next.confidence, 'Next-wave confidence'],
  [String(KB.timeline.length), 'Kept events'],
  [KB.meta.asOf, 'Last judgment']
].map(([v,l]) => '<div class="stat"><b>' + esc(v) + '</b><span>' + esc(l) + '</span></div>').join('');

const C = KB.judgment.current, N = KB.judgment.next;
document.getElementById('pulse').innerHTML = `
  <div class="grid2">
    <div>
      <article class="card">
        <div class="kicker">CURRENT WAVE · since ${esc(C.since)} · <span class="conf">${esc(C.confidence)} confidence</span></div>
        <h3>${esc(C.name)}</h3>
        <p>${esc(C.summary)}</p>
        <p><strong>Why this is the wave.</strong> ${esc(C.whyWave)}</p>
        <p><strong>For you.</strong> ${esc(C.forYou)}</p>
      </article>
      <article class="card">
        <div class="kicker">NEXT WAVE · ${esc(N.horizon)} · <span class="conf">${esc(N.confidence)} confidence</span></div>
        <h3>${esc(N.name)}</h3>
        <p>${esc(N.summary)}</p>
        <p>${esc(N.why)}</p>
        <p><strong>Not this.</strong> ${esc(N.notYet)}</p>
      </article>
    </div>
    <aside class="card">
      <h2>// HOW TO READ THIS</h2>
      <p>The email is every pull. This book only keeps what changes your picture of where AI has been and where it is going.</p>
      <p>If a later week disagrees with a judgment, a new dated line is added. Old lines stay, so you can see when the call moved.</p>
      <p class="kicker">FADING</p>
      <p>${esc(KB.judgment.fading)}</p>
    </aside>
  </div>`;

document.getElementById('waves').innerHTML = `
  <article class="card">
    <h2>// WHY THE CURRENT CALL</h2>
    <h3>${esc(C.name)}</h3>
    <p>${esc(C.trajectory)}</p>
    <ul>${C.evidence.map(e => '<li>' + esc(e) + '</li>').join('')}</ul>
  </article>
  <article class="card">
    <h2>// WHAT WOULD MAKE THE NEXT WAVE REAL</h2>
    <h3>${esc(N.name)}</h3>
    <ul>${N.watch.map(e => '<li>' + esc(e) + '</li>').join('')}</ul>
    <p>Confidence stays medium-high, not high, because computer use can still lose to connectors on anything that already has an API. The wave is the gap, not every click.</p>
  </article>`;

function renderTime(q) {
  const query = (q || '').toLowerCase();
  const rows = KB.timeline.filter(t => (t.date + t.era + t.title + t.what + t.why).toLowerCase().includes(query));
  document.getElementById('timeline').innerHTML = rows.slice().reverse().map(t => `
    <article class="card t-item">
      <div class="t-date">${esc(t.date)} · ${esc(t.era)}</div>
      <h3>${esc(t.title)}</h3>
      <p>${esc(t.what)}</p>
      <p><strong>Why it is kept.</strong> ${esc(t.why)}</p>
    </article>`).join('') || '<p class="note">Nothing in the book matches.</p>';
}
renderTime('');
document.getElementById('q-time').addEventListener('input', e => renderTime(e.target.value));

function renderConcepts(q) {
  const query = (q || '').toLowerCase();
  const rows = KB.concepts.filter(c => JSON.stringify(c).toLowerCase().includes(query));
  document.getElementById('concepts-list').innerHTML = rows.map((c, i) => `
    <details class="concept card" ${i === 0 && !query ? 'open' : ''}>
      <summary>
        <div class="kicker">CONCEPT ${String(i+1).padStart(2,'0')}</div>
        <h3>${esc(c.title)}</h3>
      </summary>
      <p class="stall">${esc(c.stall)}</p>
      <p>${esc(c.plain)}</p>
      <p><strong>The actual difference</strong></p>
      <ul>${c.difference.map(d => '<li>' + esc(d) + '</li>').join('')}</ul>
      <p><strong>When it matters.</strong> ${esc(c.whenItMatters)}</p>
      <p><strong>For Vercler and RamClean.</strong> ${esc(c.forYou)}</p>
      <p><strong>What to watch next.</strong> ${esc(c.watch)}</p>
      ${links(c.sources)}
    </details>`).join('') || '<p class="note">Nothing in the book matches.</p>';
}
renderConcepts('');
document.getElementById('q-con').addEventListener('input', e => renderConcepts(e.target.value));

document.getElementById('ledger-list').innerHTML = KB.ledger.map(item => `
  <article class="card">
    <div class="kicker">${esc(item.date)} · ${esc(item.source)}</div>
    <h3>${esc(item.title)}</h3>
    <p>${esc(item.body)}</p>
    <p><strong>Why it is in the book.</strong> ${esc(item.why)}</p>
    <p class="note">Seen via: ${esc(item.accounts)}<br>Origin: ${esc(item.origin)}</p>
    ${links(item.sources)}
  </article>`).join('');

document.getElementById('watch').innerHTML = `
  <article class="card">
    <h2>// ACCOUNTS</h2>
    <p class="note">Read these when you want the argument, not the launch post. Primary company accounts are for checking what actually shipped.</p>
    ${KB.accounts.map(a => `<p><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.handle)}</a> · ${esc(a.name)}<br><span class="note">${esc(a.why)}</span></p>`).join('')}
  </article>
  <article class="card">
    <h2>// HOW THE BOOK GROWS</h2>
    <p>A new scan does not replace the page. It adds a timeline line, a ledger note, or a revised judgment with a new date. Concepts stay until the idea itself changes, and then a new concept is added beside the old one.</p>
    <p>Volume-per-minute counters are not on this page anymore. They pretended to be live. The hourly email is the place for the raw tape.</p>
  </article>`;

document.querySelectorAll('button.nav').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('button.nav').forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.section').forEach(s => s.classList.remove('on'));
    btn.classList.add('active');
    document.getElementById(btn.dataset.s).classList.add('on');
  });
});
</script>
</body>
</html>
