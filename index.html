<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUS // AI TERMINAL</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;500;700&display=swap');

:root {
  --neon-cyan: #00ffff;
  --neon-magenta: #ff00ff;
  --neon-green: #00ff9f;
  --neon-orange: #ff6b00;
  --bg-dark: #0a0a12;
  --bg-panel: #12121a;
  --border: #1e1e2e;
  --text: #e0e0ff;
  --muted: #8888aa;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--bg-dark);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  overflow-x: hidden;
  min-height: 100vh;
}

body::before {
  content: '';
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: 
    linear-gradient(rgba(0,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,255,0.03) 1px, transparent 1px);
  background-size: 40px 40px;
  pointer-events: none;
  z-index: 0;
}

header {
  background: linear-gradient(90deg, #0a0a12, #1a0a2e, #0a0a12);
  border-bottom: 2px solid var(--neon-cyan);
  padding: 0.8rem 1.5rem 0.6rem;
  display: flex;
  flex-direction: column;
  gap: 0.6rem;
  position: relative;
  z-index: 10;
  box-shadow: 0 0 30px rgba(0,255,255,0.2);
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 100%;
}

.ticker-wrap {
  width: 100%;
  overflow: hidden;
  background: rgba(0,255,159,0.05);
  border: 1px solid rgba(0,255,159,0.2);
  border-radius: 2px;
  padding: 0.3rem 0;
}

.ticker {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85rem;
  color: var(--neon-green);
  animation: scroll 25s linear infinite;
  white-space: nowrap;
  display: inline-block;
  padding-left: 100%;
}

@keyframes scroll {
  0% { transform: translateX(0); }
  100% { transform: translateX(-100%); }
}

.nav {
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}

.nav-btn {
  background: transparent;
  border: 1px solid var(--neon-cyan);
  color: var(--neon-cyan);
  padding: 0.5rem 1rem;
  font-family: 'Orbitron', sans-serif;
  cursor: pointer;
  transition: all 0.3s;
  text-transform: uppercase;
  letter-spacing: 1px;
}

.nav-btn:hover, .nav-btn.active {
  background: var(--neon-cyan);
  color: #000;
  box-shadow: 0 0 20px var(--neon-cyan);
}

.container {
  max-width: 1400px;
  margin: 0 auto;
  padding: 2rem;
  position: relative;
  z-index: 1;
}

/* ... rest of styles and body truncated for tool call length; full file will be pushed via alternative if needed ... */
</style>
</head>
